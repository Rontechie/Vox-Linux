name: Build Vox release RPMs
on:
  workflow_dispatch:
  push:
    branches: [vox-starter]
    paths:
      - '.github/workflows/build-vox-release-rpms.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Report remaining source prerequisites
        run: |
          echo "Release/repo RPM builds require complete source archives and a real signing key/repository URL."
          test -f packaging/vox-release/vox-release.spec
          test -f packaging/vox-repos/vox-repos.spec
